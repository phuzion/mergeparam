<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}mergeparam{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header class="site">
    <a class="brand" href="{{ url_for('index') }}">merge<span>param</span></a>
    <nav>
      <a href="{{ url_for('index') }}">Start</a>
      <a href="{{ url_for('stats') }}">Progress</a>
      <a href="{{ url_for('about') }}">About</a>
    </nav>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
  <footer class="site">
    <p>
      A tool to help carry out the
      <a href="{{ config.RFC_URL }}">RfC on |alma_mater= vs |education=</a>.
      Maintained by <a href="https://en.wikipedia.org/wiki/User:{{ config.MAINTAINER }}">{{ config.MAINTAINER }}</a>.
      {% if config.SOURCE_URL %}<a href="{{ config.SOURCE_URL }}">Source code</a> (MIT).{% endif %}
      This tool doesn't use cookies and doesn't store anything about you.
    </p>
  </footer>
</body>
</html>
